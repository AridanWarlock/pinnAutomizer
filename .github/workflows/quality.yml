name: Go quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: pinn_test
          POSTGRES_PASSWORD: pinn_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinn_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PINN_TEST_POSTGRES_DSN: postgres://pinn_test:pinn_test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: '**/go.sum'
      - run: make tools-install
      - run: make check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: quality-logs
          path: out/quality/*.log
          retention-days: 7
          if-no-files-found: ignore
