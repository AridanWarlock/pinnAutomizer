version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - "SA*"
        - "-SA1019" # Dependency deprecation migrations are reviewed separately.
  exclusions:
    generated: strict
formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/AridanWarlock/pinnAutomizer)
      custom-order: true
  exclusions:
    generated: strict
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
output:
  formats:
    text:
      print-issued-lines: false
      colors: false
  show-stats: false
